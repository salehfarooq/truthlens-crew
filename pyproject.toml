[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "truthlens-crew"
version = "0.1.0"
description = "An adversarial Gemini-powered fact-checking crew with evidence comparison and abstention metrics."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "google-generativeai>=0.8.0",
  "pandas>=2.0",
  "pydantic>=2.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
ui = ["streamlit>=1.32"]
live-search = ["tavily-python>=0.5"]

[project.scripts]
truthlens = "truthlens_crew.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
